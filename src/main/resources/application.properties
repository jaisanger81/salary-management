quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:salary}
quarkus.datasource.password=${DB_PASSWORD:salary}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/salary_management}
quarkus.datasource.jdbc.max-size=16
quarkus.flyway.migrate-at-start=true

quarkus.smallrye-health.root-path=/q/health
quarkus.log.category."com.acme.salary".level=INFO
